# Обновления зависимостей. Обычные обновления npm приходят раз в неделю одним запросом на слияние,
# исправления безопасности сразу и отдельно. Пакет моложе 7 дней не предлагается:
# то же правило задано для установки в pnpm-workspace.yaml (minimumReleaseAge).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tashkent
    cooldown:
      default-days: 7
    groups:
      weekly:
        applies-to: version-updates
        patterns: ["*"]
    open-pull-requests-limit: 5
    # Мажорные версии typescript и eslint не предлагаются: typescript-eslint и eslint-config-next их ещё не
    # поддерживают, проверка pnpm check падает. Переход - отдельная задача (docs/decisions/0166).
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly

  # Образы Caddy и PostgreSQL в compose.prod.yaml закреплены по digest (проверка main, C2, C7).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
