# Проверки на каждую отправку и каждый запрос на слияние (ТЗ, раздел 13.6).
# Шаги выкладки появятся после вехи M1.
# Сторонние действия закреплены по хешу коммита, версия указана в комментарии.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Типы, линтер, правила ТЗ, модульные тесты
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  integration:
    name: Тесты с базой данных
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # PostgreSQL 18 с pgvector поднимает Testcontainers, роли и миграции ставят те же сценарии, что на серверах.
      - run: pnpm test:integration

  e2e:
    name: Браузерные тесты, бюджет скриптов, Lighthouse
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Пароли одноразовой базы этой задачи, вне CI не используются.
      DATABASE_URL_SUPERUSER: postgres://postgres:ci-superuser@127.0.0.1:5432/postgres
      DATABASE_URL_OWNER: postgres://hub_owner:ci-owner@127.0.0.1:5432/hub
      DATABASE_URL_APP: postgres://hub_app:ci-app@127.0.0.1:5432/hub
      DATABASE_URL_AUTH: postgres://hub_auth:ci-auth@127.0.0.1:5432/hub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:bootstrap
      - run: pnpm db:migrate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - run: pnpm budget
      - run: pnpm lighthouse
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  security:
    name: Поиск секретов и уязвимых пакетов
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm audit --audit-level high

  image:
    name: Сборка образа и запуск контейнера
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag smartup-hub:ci .
      - name: Контейнер запускается и отвечает на /api/health
        run: |
          docker run --detach --name hub --publish 3000:3000 --read-only --tmpfs /tmp \
            --env HUB_URL=http://localhost:3000 --env HUB_DOMAIN=localhost \
            --env DATABASE_URL_APP=postgres://hub_app:ci-app@127.0.0.1:5432/hub \
            --env DATABASE_URL_AUTH=postgres://hub_auth:ci-auth@127.0.0.1:5432/hub \
            smartup-hub:ci
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 1
          done
          docker logs hub
          exit 1
      - name: Процесс в контейнере работает не от root
        run: test "$(docker exec hub id -u)" = "1001"
