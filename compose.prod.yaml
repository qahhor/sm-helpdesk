# Развёртывание портала по разделам 13.3 и 13.4 ТЗ: веха M1 (проверка main, C2), фоновый процесс и ClamAV
# в вехе M2 (решение 0028), TEI с моделью BGE-M3 в вехе M5 (решение 0053). Настройка и первый запуск по шагам:
# docs/runbooks/launch.md.
#
#   docker compose -f compose.prod.yaml run --rm bootstrap   # один раз: роли и база
#   docker compose -f compose.prod.yaml run --rm migrate     # при каждой выкладке
#   docker compose -f compose.prod.yaml up -d

services:
  caddy:
    # Закреплён по digest. Новый digest: docker buildx imagetools inspect caddy:<версия>.
    image: caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN:?задайте HUB_DOMAIN}
      # Копии портала, на которые Caddy делит запросы (решение 0039). Две копии: "web:3000 web2:3000" и профиль replica.
      HUB_UPSTREAMS: ${HUB_UPSTREAMS:-web:3000}
      # Кому Caddy отвечает (план W0, задача 6): по умолчанию только адресам Cloudflare, список с cloudflare.com/ips
      # на 23.11.2026. Остальным 403: заголовок CF-Connecting-IP нельзя подделать запросом в обход Cloudflare.
      # Staging без Cloudflare: TRUSTED_PROXIES="0.0.0.0/0 ::/0" в .env.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32}
    mem_limit: ${CADDY_MEM_LIMIT:-256m}
    # Привилегии ядра сброшены, кроме права занять порты ниже 1024 (аудит 23.11.2026, S9).
    cap_drop: ['ALL']
    cap_add: ['NET_BIND_SERVICE']
    security_opt: ['no-new-privileges:true']
    networks: ['edge']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web]

  web: &web
    image: ${HUB_IMAGE:?задайте HUB_IMAGE, например ghcr.io/<org>/smartup-hub:<тег>}
    restart: unless-stopped
    command: ['node', 'server.js']
    env_file: ['.env']
    user: '1001:1001'
    read_only: true
    # Пределы памяти (план W0, задача 5): утечка в одной службе не забирает память у базы. Значения под сервер
    # 8 ГБ: в сумме 6,8 ГБ, остальное системе (итоговая проверка W0, M8).
    mem_limit: ${WEB_MEM_LIMIT:-768m}
    # Без привилегий ядра и без права их получить (аудит 23.11.2026, S9). Сети: edge к Caddy и наружу, data к базе,
    # embed к TEI (вектор запроса подсказки), search к Typesense (план W6, решение 16).
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    networks: ['edge', 'data', 'embed', 'search']
    stop_grace_period: 20s
    # Писать процессу можно только сюда: временные файлы и кеш Next.js (Dockerfile).
    tmpfs: ['/tmp', '/app/.next/cache']
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', 'scripts/healthcheck.mjs']
      interval: 15s
      timeout: 3s
      retries: 3

  # Вторая копия портала (аудит 23.11.2026, находка O6): те же настройки, запускается профилем replica:
  #   HUB_UPSTREAMS="web:3000 web2:3000" DB_POOL_MAX=6 в .env, затем hubc --profile replica up -d
  # Выкладка без простоя: копии перезапускаются по одной, Caddy шлёт запросы готовой.
  web2:
    <<: *web
    profiles: ['replica']

  # Фоновый процесс (решение 0028): задачи pg-boss под ролью hub_app, ограничения те же, что у портала.
  worker:
    image: ${HUB_IMAGE:?задайте HUB_IMAGE}
    restart: unless-stopped
    command: ['node', 'worker.mjs']
    # Ключ Claude API только у фонового процесса (ТЗ 13.5, решение 97; план M5, решение 3): файл .env.worker с
    # ANTHROPIC_API_KEY, AI_MODEL_FAST и AI_MODEL_QUALITY получает один этот контейнер. Нет файла: работа без AI.
    # Там же ключ записи индекса поиска TYPESENSE_WRITE_KEY (план W6, решение 3): у портала его нет.
    env_file:
      - path: .env
      - path: .env.worker
        required: false
    user: '1001:1001'
    read_only: true
    mem_limit: ${WORKER_MEM_LIMIT:-768m}
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    # Сети: data к базе, scan к антивирусу и наружу (почта, Telegram, хранилище), embed к TEI (векторы решений),
    # search к Typesense (запись индекса).
    networks: ['data', 'scan', 'embed', 'search']
    # Остановка очереди задач ждёт до 30 секунд: Docker не должен убить процесс раньше.
    stop_grace_period: 40s
    tmpfs: ['/tmp']
    depends_on:
      postgres: { condition: service_healthy }
      clamav: { condition: service_healthy }

  # Антивирус для вложений (раздел 13.3, решение 0027). Порт 3310 открыт только внутри сети compose (CLAMAV_HOST=clamav).
  # Закреплён по digest. Базы подписей на томе: первое обновление идёт несколько минут, поэтому готовности ждём до 10 минут.
  clamav:
    image: clamav/clamav:1.5.5@sha256:12177441d1b40cef3c47b44c4090d59d4babc4c67bedd5af0fa315e603aa6dd8
    restart: unless-stopped
    mem_limit: ${CLAMAV_MEM_LIMIT:-2g}
    # Привилегии не сброшены: запуск образа меняет владельца баз и пользователя. Новых привилегий процесс не получит.
    security_opt: ['no-new-privileges:true']
    # Своя сеть с фоновым процессом: до базы и портала антивирус не достаёт. Выход наружу нужен для обновления баз.
    networks: ['scan']
    volumes: ['clamav_db:/var/lib/clamav']
    # Образ переносит CLAMD_CONF_<параметр> в clamd.conf при каждом запуске (решение 0027, пункт 20). Зашифрованный
    # архив или документ и архив сверх пределов проверки (вложенность, число файлов, размер) получают подпись
    # Heuristics.Encrypted.* или Heuristics.Limits.Exceeded.*, а не "чисто". Поток длиннее самого большого вложения.
    environment:
      CLAMD_CONF_AlertEncryptedArchive: 'yes'
      CLAMD_CONF_AlertEncryptedDoc: 'yes'
      CLAMD_CONF_AlertExceedsMax: 'yes'
      CLAMD_CONF_StreamMaxLength: '60M'
      # Обновление баз подписей без второй копии в памяти: иначе на время обновления память удваивается.
      # Проверка файлов на эти секунды ждёт; задача проверки повторяется сама.
      CLAMD_CONF_ConcurrentDatabaseReload: 'no'
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10m

  # Смысловые векторы подсказки решений (ТЗ 13.3; план M5, решения 5 и 6): Text Embeddings Inference с моделью
  # BGE-M3, 1024 измерения. Портал и фоновый процесс ходят сюда по EMBEDDINGS_URL=http://tei:80 при EMBEDDINGS=tei.
  # Закреплён по digest индекса образа cpu-1.9.4 из реестра ghcr.io (решение 0053; новый digest:
  # docker buildx imagetools inspect ghcr.io/huggingface/text-embeddings-inference:cpu-<версия>).
  # Своя внутренняя сеть embed без выхода в интернет: текст запроса клиента не уходит за пределы сервера, до базы TEI
  # не достаёт. Веса модели скачиваются один раз при подготовке сервера службой tei-download (профиль tools) в том
  # tei_models и дальше читаются с тома. Не отвечает или медленный: подсказка работает на сигнатуре и словах (решение 5).
  tei: &tei
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
    restart: unless-stopped
    command: ['--model-id', 'BAAI/bge-m3', '--port', '80']
    environment:
      # Без выхода в сеть модель берётся только из кеша на томе.
      HF_HUB_OFFLINE: '1'
      HUGGINGFACE_HUB_CACHE: /data
    # Веса BGE-M3 около 2,3 ГБ в памяти: предел с запасом на запросы.
    mem_limit: ${TEI_MEM_LIMIT:-3g}
    read_only: true
    tmpfs: ['/tmp']
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    networks: ['embed']
    volumes: ['tei_models:/data']

  # Однократное скачивание весов BGE-M3 в том tei_models (решение 0053): тот же образ с выходом в интернет. Запуск:
  # hubc --profile tools run --rm tei-download; после строки "Ready" в журнале остановить (Ctrl+C). Дальше служба tei
  # читает веса с тома без сети.
  tei-download:
    <<: *tei
    restart: 'no'
    profiles: ['tools']
    environment:
      HUGGINGFACE_HUB_CACHE: /data
    read_only: false
    networks: ['models']

  # Поиск (план W6, решения 13 и 16; решение владельца 0070): Typesense 30.2 закреплён digest индекса образа,
  # полученным запросом к Docker Hub и сверенным при скачивании образа 26.11.2026 (новый digest:
  # docker buildx imagetools inspect typesense/typesense:<версия>). Индекс производный: источник данных PostgreSQL,
  # после восстановления базы индекс строится заново (hub search:reindex), снимки не нужны. Своя внутренняя сеть search
  # с порталом и фоновым процессом: текст запроса клиента не уходит наружу, до базы Typesense не достаёт, порт не
  # публикуется. Главный ключ только в секрете typesense_api_key и у команды hub search:keys. Журналы запросов
  # выключены: в них был бы текст запроса клиента. Кеша выдачи нет (use_cache по умолчанию выключен, портал шлёт false).
  # Аналитика и CORS не включаются. На production включается только с сервером 16 ГБ (ответ владельца 0070, пункт 1);
  # до этого SEARCH_PROVIDER=postgres, и служба не запускается (профиль search).
  typesense:
    image: typesense/typesense:30.2@sha256:610f2d34b1f93d00762869da2c67736775e5798d19a2c8b91b014b8a0cc1e110
    restart: unless-stopped
    profiles: ['search']
    # Главный ключ читается из файла секрета: флагом в окружении он был бы виден в docker inspect.
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        exec /opt/typesense-server --data-dir=/data --api-key="$$(cat /run/secrets/typesense_api_key)"
        --memory-used-max-percentage=90 --disk-used-max-percentage=90
        --log-slow-searches-time-ms=-1 --enable-search-logging=false --enable-access-logging=false
        --enable-search-analytics=false
    secrets: [typesense_api_key]
    # Индекс целиком в памяти: 2-3 размера индексируемых полей (guide/system-requirements). Предел по замеру задачи 10.
    mem_limit: ${TYPESENSE_MEM_LIMIT:-2560m}
    read_only: true
    tmpfs: ['/tmp']
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    networks: ['search']
    volumes: ['typesense_data:/data']
    # В образе нет curl и wget: проверка готовности через /dev/tcp оболочки bash.
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/8108 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && grep -q "\"ok\":true" <&3']
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 60s

  # Миграции от роли hub_owner. Подключение владельца есть только здесь (раздел 13.5 ТЗ).
  migrate:
    image: ${HUB_IMAGE:?задайте HUB_IMAGE}
    profiles: ['tools']
    command: ['node', 'scripts/db/migrate.mjs']
    env_file: ['.env.migrate']
    user: '1001:1001'
    read_only: true
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    networks: ['data']
    depends_on:
      postgres: { condition: service_healthy }

  # Начальная настройка базы под суперпользователем: роли, база, расширения. Один раз на сервер.
  bootstrap:
    image: ${HUB_IMAGE:?задайте HUB_IMAGE}
    profiles: ['tools']
    command: ['node', 'scripts/db/bootstrap.mjs']
    env_file: ['.env.bootstrap']
    user: '1001:1001'
    read_only: true
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    networks: ['data']
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    # Закреплён по digest. Том в /var/lib/postgresql: образ версии 18 хранит данные в /var/lib/postgresql/18/docker.
    image: pgvector/pgvector:pg18@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
    restart: unless-stopped
    # Настройки под сервер 8 ГБ (план W0, задача 5; аудит 23.11.2026, O3). Статистика запросов: pg_stat_statements.
    # Запросы дольше 250 мс пишутся в журнал без значений параметров: в значениях данные клиентов.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=100
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - log_min_duration_statement=250
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_lock_waits=on
      # Непрерывный архив журнала (решение 0039): готовый сегмент копируется в каталог на сервере, оттуда его шифрует
      # и выгружает scripts/ops/wal-ship.sh. По умолчанию выключен: PG_ARCHIVE_MODE=on в .env и перезапуск базы.
      # Сегмент закрывается не реже раза в 5 минут: столько данных можно потерять при гибели сервера.
      - -c
      - archive_mode=${PG_ARCHIVE_MODE:-off}
      - -c
      # sync: сегмент и каталог записаны на диск до ответа базе. Иначе после внезапной перезагрузки база считала бы
      # сегмент сохранённым, а в архиве лежал бы обрезанный файл под его именем.
      - archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f.tmp && sync /wal-archive/%f.tmp && mv /wal-archive/%f.tmp /wal-archive/%f && sync /wal-archive
      - -c
      - archive_timeout=300
    mem_limit: ${PG_MEM_LIMIT:-3g}
    # Привилегии не сброшены: запуск образа меняет владельца каталога данных и пользователя. Новых привилегий процесс не получит.
    security_opt: ['no-new-privileges:true']
    # Только внутренняя сеть: у базы нет выхода в интернет.
    networks: ['data']
    # Разделяемая память для параллельных запросов: по умолчанию у контейнера 64 МБ.
    shm_size: 256m
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser
    secrets: [pg_superuser]
    volumes:
      - pg_data:/var/lib/postgresql
      - ./wal-archive:/wal-archive
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s

# Три сети вместо общей (аудит 23.11.2026, S9): взлом одной службы не открывает остальные.
#   edge: Caddy и портал. Через неё портал ходит наружу (вход Smartup, почта, Telegram, хранилище).
#   data: портал, фоновый процесс, задачи базы и PostgreSQL. Внутренняя: выхода в интернет нет.
#   scan: фоновый процесс и антивирус. Через неё фоновый процесс ходит наружу, антивирус обновляет базы подписей.
#   embed: портал, фоновый процесс и TEI. Внутренняя: текст запроса клиента не уходит наружу (ТЗ 11.6).
#   models: только однократное скачивание весов модели (tei-download, профиль tools).
#   search: портал, фоновый процесс и Typesense. Внутренняя: текст запроса клиента не уходит наружу (план W6).
networks:
  edge: {}
  data:
    internal: true
  scan: {}
  embed:
    internal: true
  models: {}
  search:
    internal: true

volumes:
  caddy_data: {}
  pg_data: {}
  clamav_db: {}
  tei_models: {}
  typesense_data: {}

secrets:
  pg_superuser:
    file: ./secrets/pg_superuser
  typesense_api_key:
    file: ./secrets/typesense_api_key
